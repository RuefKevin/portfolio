name: CI

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [main]

jobs:
    backend-build:
        name: Backend Build & Lint
        runs-on: ubuntu-latest
        env:
            SQLX_OFFLINE: true
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                components: clippy

            - name: Cache Rust
              uses: actions/cache@v4
              with:
                path: |
                    ~/.cargo/registry/index/
                    ~/.cargo/git/db/
                    backend/target/
                key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Cargo Check
              run: cd backend && cargo check

            - name: Clippy
              run: cd backend && cargo clippy -- -D warnings

            - name: Tests
              run: cd backend && cargo test

    backend-audit:
      name: Backend Security Audit
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4

          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable

          - name: Cache cargo-audit binary
            uses: actions/cache@v4
            with:
              path: ~/.cargo/bin/cargo-audit
              key: cargo-audit-${{ runner.os }}-v1

          - name: Install cargo-audit
            run: cargo install cargo-audit --locked 2>/dev/null || true

          - name: Cargo Audit
            run: cd backend && cargo audit

    frontend-build:
      name: Frontend Build & Type Check
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4

          - name: Setup Node
            uses: actions/setup-node@v4
            with:
              node-version: 20
              cache: npm
              cache-dependency-path: frontend/package-lock.json

          - name: Install Dependencies
            run: cd frontend && npm ci

          - name: Type Check
            env:
              BACKEND_URL: http://localhost:3000
            run: cd frontend && npm run check

          - name: Lint
            run: cd frontend && npm run lint

          - name: Tests
            run: cd frontend && npm run test

    frontend-audit:
        name: Frontend Security Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install Dependencies
              run: cd frontend && npm ci

            - name: npm Audit
              run: cd frontend && npm audit --audit-level=critical || true
